name: update-banner
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency: banner
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python update_banner.py
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      - name: save count
        run: |
          if ! git diff --quiet count.txt; then
            git config user.name "banner-bot"; git config user.email "banner-bot@users.noreply.github.com"
            git add count.txt; git commit -m "count [skip ci]"; git push
          fi
